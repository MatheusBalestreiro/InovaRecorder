name: 🚀 Criar Release MSI

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v3

      - name: 🛠️ Instalar .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '6.0.x'

      - name: 🔨 Restaurar dependências
        run: dotnet restore

      - name: 🏗️ Compilar projeto
        run: dotnet build --configuration Release

      - name: 📦 Publicar build
        run: dotnet publish -c Release -o out

      - name: 🛠️ Instalar WiX Toolset
        run: choco install wixtoolset --yes

      - name: 📦 Criar MSI
        shell: pwsh
        run: |
          # Remove prefixo 'refs/tags/v'
          $version = $env:GITHUB_REF_NAME -replace '^refs/tags/v',''
          Write-Host "Versão detectada: $version"

          # Compila MSI
          candle.exe Installer/Product.wxs -dProductVersion="$version" -out Installer/Product.wixobj
          light.exe Installer/Product.wixobj -out InovaRecorder.msi

      - name: 📄 Extrair changelog para release notes
        shell: pwsh
        run: |
          $changelog = Get-Content CHANGELOG.md -Raw
          echo "NOTES<<EOF" >> $env:GITHUB_ENV
          echo $changelog >> $env:GITHUB_ENV
          echo "EOF" >> $env:GITHUB_ENV

      - name: 🚀 Criar Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: ${{ env.NOTES }}
          files: |
            InovaRecorder.msi
