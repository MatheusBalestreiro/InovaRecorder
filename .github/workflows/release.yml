name: 🚀 Criar Release MSI

#.

on:
  push:
    tags:
      - 'v*.*.*'   # dispara quando criar tag do tipo v1.0.0
  workflow_dispatch:   # permite rodar manualmente no Actions

env:
  TEST_VERSION: "0.1.0"   # versão usada para testes manuais (sem tag)

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v3

      - name: 🛠️ Instalar .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '6.0.x'

      - name: 🔨 Restaurar dependências
        run: dotnet restore

      - name: 🏗️ Compilar projeto
        run: dotnet build --configuration Release

      - name: 📦 Publicar build
        run: dotnet publish -c Release -o out

      - name: 🛠️ Instalar WiX Toolset
        run: choco install wixtoolset --yes

      - name: 📦 Criar MSI
        shell: pwsh
        run: |
          # Remove 'refs/tags/' e o 'v' da tag se existir, senão usa versão de teste
          if ($env:GITHUB_REF_NAME) {
              $tag = $env:GITHUB_REF_NAME.Split('/')[-1]   # pega só o nome da tag
              $version = $tag -replace '^v',''             # remove o "v"
          } else {
              $version = $env:TEST_VERSION
          }

          # Garantir que tenha 4 partes (x.x.x.x)
          if ($version.Split('.').Length -eq 3) { $version += ".0" }

          Write-Host "Versão usada: $version"

          # Compila MSI usando WiX
          candle.exe "Installer/Product.wxs" -dProductVersion="$version" -ext WixUIExtension -out "Installer/Product.wixobj"
          light.exe "Installer/Product.wixobj" -ext WixUIExtension -out "InovaRecorder.msi"


      - name: 📄 Extrair changelog para release notes
        shell: pwsh
        run: |
          $changelog = Get-Content CHANGELOG.md -Raw
          echo "NOTES<<EOF" >> $env:GITHUB_ENV
          echo $changelog >> $env:GITHUB_ENV
          echo "EOF" >> $env:GITHUB_ENV

      - name: 🚀 Criar Release
        if: startsWith(github.ref, 'refs/tags/v')  # só cria release se for tag
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: ${{ env.NOTES }}
          files: |
            InovaRecorder.msi
